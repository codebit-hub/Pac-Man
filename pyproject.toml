[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pac_man"
version = "1.0.0"
description = "42 Code: Complete, playable Pac-Man game in Python"
requires-python = ">=3.8"

[tool.flake8]
exclude = ["Makefile", "venv", ".git", "__pycache__", ".mypy_cache"]
max-line-length = 79
ignore = ["E203", "W503"]

[tool.mypy]
exclude = ["Makefile", "venv", ".git"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
